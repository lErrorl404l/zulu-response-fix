name: build and test

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (mingw + wine)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine

      - name: Build proxy DLL
        run: >
          i686-w64-mingw32-gcc -shared -O2 -o dinput8.dll
          zulu_dinput8.c zulu_dinput8.def -lws2_32
          -Wl,--enable-stdcall-fixup

      - name: Build test harness
        run: >
          i686-w64-mingw32-gcc -O2 -o test_harness.exe
          test_harness.c -lws2_32 -ldinput8 -lwininet

      - name: Force native dinput8 in Wine
        run: wine reg add "HKCU\Software\Wine\DllOverrides" /v dinput8 /d native /f

      - name: Run behavioural tests under Wine
        run: wine test_harness.exe

      - name: Sign build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dinput8.dll

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinput8.dll-linux
          path: dinput8.dll

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Build proxy DLL
        shell: msys2 {0}
        run: >
          i686-w64-mingw32-gcc -shared -O2 -o dinput8.dll
          zulu_dinput8.c zulu_dinput8.def -lws2_32
          -Wl,--enable-stdcall-fixup

      - name: Build test harness
        shell: msys2 {0}
        run: >
          i686-w64-mingw32-gcc -O2 -o test_harness.exe
          test_harness.c -lws2_32 -ldinput8 -lwininet

      - name: Run behavioural tests natively
        shell: msys2 {0}
        run: ./test_harness.exe

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinput8.dll-windows
          path: dinput8.dll

  scan:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dinput8.dll-linux
          path: artifact

      - name: Malware scan the built DLL (ClamAV)
        run: >
          docker run --rm -v "$PWD/artifact:/scan" clamav/clamav
          clamscan --no-summary /scan/dinput8.dll

      - name: Upload to VirusTotal
        if: ${{ secrets.VT_API_KEY != '' }}
        uses: virustotal/github-action@v0.5.1
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: artifact/dinput8.dll