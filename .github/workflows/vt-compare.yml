# TEMPORARY comparison: mingw (Linux) vs MSVC (Windows) build, and current
# VirusTotal status of every released build. Run manually via
# `gh workflow run vt-compare.yml`. Delete this file after the decision.
name: vt-compare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    env:
      VT_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC (32-bit DLL)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat" >nul
          cl /LD /O2 zulu_dinput8.c /Fe:dinput8-msvc.dll /link /DEF:zulu_dinput8.def ws2_32.lib wininet.lib

      - name: Upload MSVC build to VirusTotal
        id: vt
        if: ${{ env.VT_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: dinput8-msvc.dll
          request_rate: 4

      - name: Query current VirusTotal status of every known build
        if: ${{ env.VT_KEY != '' }}
        env:
          HASHLIST: |
            f7ee3cdf2f4db1898f2fb74442294dd65dce1333aceee356386c2ba98d5d0d04
            071f125faf84e1e75b66dea1a92f9efadf4c58d3fffd79c7635c682d7c328994
            ac7c3ec44bc0ee2e179cf55adbbad2511f0e2c8699057d807272b8ba562396a7
        run: |
          $ErrorActionPreference = "Continue"
          echo "hash,malicious,suspicious,harmless,undetected,engine_count" | Out-File -Encoding utf8 compare.csv
          foreach ($h in $env:HASHLIST -split "`n") {
            $h = $h.Trim()
            if (-not $h) { continue }
            try {
              $r = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/$h" -Headers @{"x-apikey"=$env:VT_KEY}
              $s = $r.data.attributes.last_analysis_stats
              $total = $s.malicious + $s.suspicious + $s.harmless + $s.undetected + $s["type-unsupported"] + $s.timeout + $s["confirmed-timeout"] + $s.failure
              echo "$h,$($s.malicious),$($s.suspicious),$($s.harmless),$($s.undetected),$total" | Out-File -Append -Encoding utf8 compare.csv
            } catch {
              echo "$h,QUERY_FAILED" | Out-File -Append -Encoding utf8 compare.csv
            }
            Start-Sleep -Seconds 20
          }
          # MSVC build hash
          $mh = (Get-FileHash dinput8-msvc.dll -Algorithm SHA256).Hash.ToLower()
          try {
            $r = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/$mh" -Headers @{"x-apikey"=$env:VT_KEY}
            $s = $r.data.attributes.last_analysis_stats
            $total = $s.malicious + $s.suspicious + $s.harmless + $s.undetected
            echo "MSVC_$mh,$($s.malicious),$($s.suspicious),$($s.harmless),$($s.undetected),$total" | Out-File -Append -Encoding utf8 compare.csv
          } catch {
            echo "MSVC_$mh,QUERY_FAILED" | Out-File -Append -Encoding utf8 compare.csv
          }
          Get-Content compare.csv

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: vt-compare
          path: compare.csv