# Release process (per Defence Git Practices: CI builds, signed tag, SBOM
# generated at the tag event from git metadata, release assets attached).
#
# Triggered by pushing a signed tag v*. The release DLL is built here in CI
# from the tagged commit - never from a local machine.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build proxy DLL
        run: >
          i686-w64-mingw32-gcc -shared -O2 -o dinput8.dll
          zulu_dinput8.c zulu_dinput8.def -lws2_32
          -Wl,--enable-stdcall-fixup

      - name: Malware scan the release DLL (ClamAV)
        run: >
          docker run --rm -v "$PWD:/scan" clamav/clamav
          clamscan --no-summary /scan/dinput8.dll

      - name: Generate SBOM (Syft, SPDX)
        run: >
          docker run --rm -v "$PWD:/src" anchore/syft /src
          --source-name zulu-response-fix
          -o spdx-json=/src/sbom.json

      - name: Prepare release notes
        run: |
          HASH=$(sha256sum dinput8.dll | cut -d' ' -f1)
          COMMIT=$(git rev-parse --short HEAD)
          cat > notes.md <<EOF
          Drag-and-drop fix for Zulu Response (Steam 401250). Stops the game
          closing at the menu.

          ## Install
          1. Download dinput8.dll (the file below)
          2. Steam > right-click Zulu Response > Manage > Browse local files
          3. Open Binaries > Win32
          4. Drag dinput8.dll into that folder
          5. Launch the game

          Uninstall: delete dinput8.dll. Works on Windows and Linux/Proton.

          ## Verify
          - SHA-256: \`$HASH\`
          - Built by GitHub CI from commit \`$COMMIT\`
          - VirusTotal analysis of this exact build is appended below
          - ClamAV scan: clean (run in CI on the release build)
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dinput8.dll
            sbom.json
          body_path: notes.md

      - name: VirusTotal scan
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        if: ${{ env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: dinput8.dll
          request_rate: 4

      - name: Append VirusTotal link to release body
        if: ${{ steps.vt.outputs.analysis != '' }}
        env:
          VT_OUTPUT: ${{ steps.vt.outputs.analysis }}
        run: |
          URL="${VT_OUTPUT#*=}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body -q .body > body.md
          printf '\nVirusTotal analysis of this build: %s\n' "$URL" >> body.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file body.md